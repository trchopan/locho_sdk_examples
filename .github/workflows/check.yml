name: Notes API and browser application
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/checkout@v7
        with:
          repository: trchopan/locho
          ref: 0c8ad57cc91af30144138bd324aeca86604f48dd
          path: target/locho
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo build --locked --release --bin locho
        working-directory: target/locho
      - run: npm run smoke:locho
        env:
          LOCHO_BINARY: ${{ github.workspace }}/target/locho/target/release/locho
      - run: npx playwright install --with-deps chromium firefox webkit
      - uses: actions/checkout@v7
        with:
          repository: trchopan/locho
          ref: 3786da3127338b2530e0cd8cea8ef23bc6d55dfd
          path: target/locho-previous
          persist-credentials: false
      - run: cargo build --locked --release --bin locho
        working-directory: target/locho-previous
      - run: npm run smoke:host-upgrade
        env:
          LOCHO_BINARY: ${{ github.workspace }}/target/locho/target/release/locho
          LOCHO_PREVIOUS_BINARY: ${{ github.workspace }}/target/locho-previous/target/release/locho
      - run: npm run test:browser
        env:
          LOCHO_BINARY: ${{ github.workspace }}/target/locho/target/release/locho
