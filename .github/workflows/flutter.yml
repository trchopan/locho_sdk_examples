name: Flutter notes app
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python3 scripts/setup-flutter-sdk.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - run: flutter pub get
        working-directory: apps/flutter
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
        working-directory: apps/flutter
      - run: flutter analyze && flutter test
        working-directory: apps/flutter
      - run: flutter build apk --debug --target-platform android-arm64,android-x64 && flutter build apk --release --target-platform android-arm64,android-x64
        if: runner.os == 'Linux'
        working-directory: apps/flutter
      - run: flutter config --no-enable-swift-package-manager && flutter build ios --simulator --debug && flutter build ios --release --no-codesign
        if: runner.os == 'macOS'
        working-directory: apps/flutter
